<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Budget Submissions — Staff Review</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5f6;
    color: #1a1a1a;
  }

  header {
    background: #24292f;
    color: #fff;
    padding: 1rem 1.5rem;
  }

  header h1 {
    margin: 0;
    font-size: 1.15rem;
  }

  main {
    padding: 1.5rem;
    max-width: 100%;
  }

  #loadingState {
    padding: 2rem 1.5rem;
    color: #555;
  }

  #loginSection {
    max-width: 360px;
    margin: 3rem auto;
    background: #fff;
    border: 1px solid #d0d4d8;
    border-radius: 8px;
    padding: 1.5rem;
  }

  #loginSection h2 {
    margin-top: 0;
    font-size: 1.1rem;
  }

  #loginSection label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 0.75rem 0 0.25rem;
  }

  #loginSection input {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid #c0c4c8;
    border-radius: 4px;
    font-size: 0.95rem;
  }

  #loginSection button {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.6rem;
    background: #24292f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 0.95rem;
    cursor: pointer;
  }

  #loginSection button:hover {
    background: #444c56;
  }

  #loginError {
    margin-top: 0.75rem;
    color: #b3261e;
    font-size: 0.85rem;
    min-height: 1.2em;
  }

  #dashboardSection {
    display: none;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .toolbar button {
    padding: 0.5rem 0.9rem;
    border: 1px solid #c0c4c8;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .toolbar button:hover {
    background: #eceff1;
  }

  #downloadCsvBtn {
    background: #24292f;
    color: #fff;
    border-color: #24292f;
  }

  #downloadCsvBtn:hover {
    background: #444c56;
  }

  #submissionCount {
    font-size: 0.85rem;
    color: #555;
  }

  #fetchError {
    color: #b3261e;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid #d0d4d8;
    border-radius: 6px;
    background: #fff;
  }

  table {
    border-collapse: collapse;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  th, td {
    padding: 0.5rem 0.65rem;
    border-bottom: 1px solid #e4e7ea;
    text-align: left;
    vertical-align: top;
  }

  th {
    background: #f0f2f4;
    position: sticky;
    top: 0;
    white-space: nowrap;
  }

  td.comments-cell {
    white-space: normal;
    min-width: 220px;
    max-width: 360px;
  }

  tbody tr:hover {
    background: #fafbfc;
  }

  #emptyState {
    padding: 1.5rem;
    color: #555;
  }
</style>
</head>
<body>

<header>
  <h1>Kent County Budget Simulator — Staff Review</h1>
</header>

<main>
  <div id="loadingState">Checking session…</div>

  <section id="loginSection" style="display: none;">
    <h2>Staff Login</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit">Log In</button>
      <div id="loginError"></div>
    </form>
  </section>

  <section id="dashboardSection">
    <div class="toolbar">
      <div class="toolbar-left">
        <button type="button" id="downloadCsvBtn">Download CSV</button>
        <button type="button" id="refreshBtn">Refresh</button>
        <span id="submissionCount"></span>
      </div>
      <button type="button" id="logoutBtn">Log Out</button>
    </div>
    <div id="fetchError"></div>
    <div id="tableWrap" class="table-wrap"></div>
    <div id="emptyState" style="display: none;">No submissions yet.</div>
  </section>
</main>

<script type="module" src="staff-review.js"></script>
</body>
</html>
